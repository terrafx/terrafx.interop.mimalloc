name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - Directory.Packages.props
      - global.json
      - NuGet.config
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - Directory.Packages.props
      - global.json
      - NuGet.config

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore TerraFX.Interop.Mimalloc.slnx --verbosity minimal
